name: RecordReader
options:
  bundleIdPrefix: com.recordreader
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
packages:
  RecordReader:
    path: .
targets:
  RecordReader:
    type: application
    platform: iOS
    sources:
      - App/RecordReader
    resources:
      - path: App/RecordReader/Resources
    dependencies:
      - package: RecordReader
        product: RecordReaderCore
      - framework: .build/sherpa-onnx-ios/build-ios/sherpa-onnx.xcframework
        embed: false
      - framework: .build/sherpa-onnx-ios/build-ios/ios-onnxruntime/onnxruntime.xcframework
        embed: false
    settings:
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.9"
      SWIFT_OBJC_BRIDGING_HEADER: App/RecordReader/SherpaOnnx/SherpaOnnx-Bridging-Header.h
      OTHER_LDFLAGS: "$(inherited) -lc++"
      HEADER_SEARCH_PATHS:
        - "$(SRCROOT)/.build/sherpa-onnx-ios/build-ios/sherpa-onnx.xcframework/ios-arm64/Headers"
        - "$(SRCROOT)/.build/sherpa-onnx-ios/build-ios/sherpa-onnx.xcframework/ios-arm64_x86_64-simulator/Headers"
      PRODUCT_BUNDLE_IDENTIFIER: com.recordreader.app
      TARGETED_DEVICE_FAMILY: "1"
      INFOPLIST_KEY_CFBundleDisplayName: RecordReader
      INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: RecordReader 读取你选择的音频文件，并使用 iOS 中文语音识别生成字幕。
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: true
      INFOPLIST_KEY_UIFileSharingEnabled: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []
