name: iOS

on:
  push:
    branches: [main, codex/whisperkit-coreml-experiment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run core tests
        run: swift test

      - name: Prepare sherpa-onnx iOS assets
        run: scripts/prepare-sherpa-onnx-ios.sh

      - name: Prepare bundled WhisperKit Small model
        run: scripts/prepare-whisperkit-small-ios.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project RecordReader.xcodeproj \
            -scheme RecordReader \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device IPA
        run: |
          xcodebuild \
            -project RecordReader.xcodeproj \
            -scheme RecordReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/RecordReader.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../RecordReader-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecordReader-unsigned-ipa
          path: build/RecordReader-unsigned.ipa

      - name: Publish latest unsigned IPA release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="latest-unsigned-ipa"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME//\//-}-unsigned-ipa"
          fi

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "$RELEASE_TAG"

          gh release create "$RELEASE_TAG" build/RecordReader-unsigned.ipa \
            --title "Latest unsigned IPA" \
            --notes "Unsigned IPA built from $GITHUB_SHA." \
            --latest=false \
          || gh release upload "$RELEASE_TAG" build/RecordReader-unsigned.ipa --clobber

          gh release edit "$RELEASE_TAG" \
            --title "Latest unsigned IPA" \
            --notes "Unsigned IPA built from $GITHUB_SHA." \
            --latest=false
